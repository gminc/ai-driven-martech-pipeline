{% macro product_card(p, list_id, list_name, index) -%}
<article class="product-card" data-item='{{ {"item_id": p.id, "item_name": p.name, "item_category": p.category, "price": p.price, "index": index, "item_list_id": list_id, "item_list_name": list_name} | tojson }}'>
  <a class="card-media" href="{{ url_for('product_detail', product_id=p.id) }}">
    <img src="{{ url_for('static', filename=p.image) }}" alt="{{ p.name }}" width="640" height="444" loading="lazy">
    {% if p.badge %}<span class="badge">{{ p.badge }}</span>{% endif %}
  </a>
  <div class="card-body">
    <p class="card-category">{{ p.category }}</p>
    <h3><a href="{{ url_for('product_detail', product_id=p.id) }}">{{ p.name }}</a></h3>
    <p class="card-subtitle">{{ p.subtitle }}</p>
    <p class="card-price">
      NT$ {{ "{:,}".format(p.price) }}
      {% if p.compare_at_price %}<s>NT$ {{ "{:,}".format(p.compare_at_price) }}</s>{% endif %}
    </p>
  </div>
</article>
{%- endmacro %}
