<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f3ec"/>
      <stop offset="1" stop-color="#efe8dc"/>
    </linearGradient>
    <pattern id="linen" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="none"/>
      <path d="M0 0 H8 M0 4 H8" stroke="#2b2723" stroke-opacity="0.05" stroke-width="1"/>
      <path d="M0 0 V8 M4 0 V8" stroke="#2b2723" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <pattern id="terry" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.1" fill="#2b2723" fill-opacity="0.05"/>
      <circle cx="8" cy="8" r="2.1" fill="#2b2723" fill-opacity="0.05"/>
    </pattern>
    <pattern id="rib" width="9" height="6" patternUnits="userSpaceOnUse">
      <path d="M2 0 V6 M6 0 V6" stroke="#2b2723" stroke-opacity="0.09" stroke-width="2" stroke-linecap="round"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2b2723" flood-opacity="0.13"/>
    </filter>
    <filter id="soft-sm" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#2b2723" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="520" height="380" fill="url(#bgGrad)"/>
  <rect width="520" height="380" fill="url(#linen)"/>
  <rect x="0" y="300" width="520" height="80" fill="#e6dbc7" fill-opacity="0.55"/>
  <rect x="0" y="300" width="520" height="80" fill="url(#linen)"/>
  <path d="M0 300 H520" stroke="#2b2723" stroke-opacity="0.08"/>
  <g filter="url(#soft)">
    <rect x="70" y="80" width="380" height="200" rx="8" fill="#f7f3ec" stroke="#2b2723" stroke-opacity="0.18"/>
    <path d="M70 120 H450 M70 150 H450 M70 180 H450 M70 210 H450" stroke="#b07a45" stroke-opacity="0.45" stroke-width="3"/>
    <path d="M130 80 V280 M200 80 V280 M270 80 V280 M340 80 V280 M400 80 V280" stroke="#2b2723" stroke-opacity="0.12" stroke-width="2"/>
    <rect x="60" y="188" width="400" height="18" rx="6" fill="#3f6b5b" fill-opacity="0.8"/>
    <circle cx="96" cy="197" r="16" fill="#e6dbc7" stroke="#2b2723" stroke-opacity="0.2"/>
    <circle cx="424" cy="197" r="16" fill="#e6dbc7" stroke="#2b2723" stroke-opacity="0.2"/>
  </g>
  <text x="70" y="330" font-family="Noto Serif TC, Songti TC, serif" font-size="14" fill="#8c8375" text-anchor="start">彰化社頭 · 雲林虎尾的合作織廠</text>
</svg>
