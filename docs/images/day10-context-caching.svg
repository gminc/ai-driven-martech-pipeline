<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="1240" height="600" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-size: 22px; font-weight: 700; fill: #202124; }
      .colhead { font-size: 15px; font-weight: 700; fill: #5f6368; }
      .raw { fill: #f1f3f4; stroke: #dadce0; stroke-width: 1.2; }
      .rawtxt { font-size: 14px; fill: #3c4043; }
      .step { fill: #ffffff; stroke: #1a73e8; stroke-width: 1.4; }
      .steptitle { font-size: 15px; font-weight: 700; fill: #1a73e8; }
      .stepline { font-size: 13px; fill: #3c4043; }
      .sub { font-size: 12.5px; fill: #5f6368; }
      .fact { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 1.6; }
      .facthead { fill: #1a73e8; }
      .facttitle { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .factline { font-size: 13px; fill: #174ea6; }
      .ai { fill: #fef7e0; stroke: #f29900; stroke-width: 1.8; }
      .aititle { font-size: 15px; font-weight: 700; fill: #b06000; }
      .ailine { font-size: 13px; fill: #5f4100; }
      .gate { fill: #ffffff; stroke: #f29900; stroke-width: 1.3; stroke-dasharray: 5 4; }
      .gatetxt { font-size: 12.5px; fill: #b06000; }
      .flow { stroke: #1a73e8; stroke-width: 2.2; fill: none; }
      .aiflow { stroke: #f29900; stroke-width: 2.2; fill: none; }
      .note { font-size: 13px; fill: #5f6368; }
      .arrowhead { fill: #1a73e8; }
      .arrowhead2 { fill: #f29900; }
      .panel { fill: #fafafa; stroke: #dadce0; stroke-width: 1; }
      .barlabel { font-size: 13px; fill: #3c4043; }
      .barval { font-size: 13px; font-weight: 700; fill: #202124; }
      .bar-old { fill: #9aa0a6; }
      .bar-new { fill: #8ab4f8; }
      .bar-exp { fill: #f29900; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrowhead2" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1240" height="600"/>
  <text class="title" x="30" y="44">Day 10 快取機制：每題都一樣的內容先存進 Gemini，之後每題只送會變的數字</text>

  <!-- 第一列：固定內容 -->
  <text class="colhead" x="30" y="92">倉儲（Day 07）</text>
  <rect class="raw" x="30" y="104" width="190" height="34" rx="6"/><text class="rawtxt" x="46" y="126">dim_product、dim_date</text>
  <rect class="raw" x="30" y="146" width="190" height="34" rx="6"/><text class="rawtxt" x="46" y="168">dim_creative</text>
  <rect class="raw" x="30" y="188" width="190" height="34" rx="6"/><text class="rawtxt" x="46" y="210">fct_ad_daily</text>

  <path class="flow" d="M226,163 L262,163" marker-end="url(#arrow)"/>

  <rect class="step" x="270" y="100" width="220" height="126" rx="8"/>
  <text class="steptitle" x="286" y="128">① 組固定內容</text>
  <text class="stepline" x="286" y="154">context.sql</text>
  <text class="sub" x="286" y="178">角色、六個候選原因、規則</text>
  <text class="sub" x="286" y="200">商品、檔期、素材、每週成效</text>

  <path class="flow" d="M496,163 L532,163" marker-end="url(#arrow)"/>

  <rect class="fact" x="540" y="112" width="190" height="102" rx="8"/>
  <rect class="facthead" x="540" y="112" width="190" height="34" rx="8"/>
  <rect class="facthead" x="540" y="132" width="190" height="14"/>
  <text class="facttitle" x="556" y="135">cache_context</text>
  <text class="factline" x="556" y="172">一列 6,234 個 Token</text>
  <text class="factline" x="556" y="196">每題都一模一樣</text>

  <path class="aiflow" d="M736,163 L772,163" marker-end="url(#arrow2)"/>

  <rect class="step" x="780" y="112" width="190" height="102" rx="8"/>
  <text class="steptitle" x="796" y="140">② 建快取</text>
  <text class="stepline" x="796" y="166">cache.sh create</text>
  <text class="sub" x="796" y="190">建在 global，存活 30 分鐘</text>

  <path class="aiflow" d="M976,163 L1012,163" marker-end="url(#arrow2)"/>

  <rect class="ai" x="1020" y="100" width="190" height="126" rx="8"/>
  <text class="aititle" x="1036" y="128">Gemini 明確快取</text>
  <text class="ailine" x="1036" y="156">存著 6,231 個 Token</text>
  <text class="ailine" x="1036" y="180">讀取只收一折</text>
  <text class="gatetxt" x="1036" y="206">活著每小時收儲存費</text>

  <!-- 第二列：每題會變的部分 -->
  <text class="colhead" x="30" y="282">Day 09 的異常</text>
  <rect class="raw" x="30" y="296" width="190" height="44" rx="6"/><text class="rawtxt" x="46" y="323">diag_prompt</text>

  <path class="flow" d="M226,318 L262,318" marker-end="url(#arrow)"/>

  <rect class="fact" x="270" y="266" width="220" height="102" rx="8"/>
  <rect class="facthead" x="270" y="266" width="220" height="34" rx="8"/>
  <rect class="facthead" x="270" y="286" width="220" height="14"/>
  <text class="facttitle" x="286" y="289">cache_prompt</text>
  <text class="factline" x="286" y="326">每題只剩那一筆的數字</text>
  <text class="factline" x="286" y="350">139 到 179 個 Token</text>

  <path class="aiflow" d="M496,318 L772,318" marker-end="url(#arrow2)"/>
  <text class="sub" x="540" y="306">數字＋快取名稱</text>

  <rect class="ai" x="780" y="260" width="190" height="116" rx="8"/>
  <text class="aititle" x="796" y="288">③ 問 Gemini</text>
  <text class="ailine" x="796" y="314">AI.GENERATE</text>
  <text class="ailine" x="796" y="338">endpoint 寫 global 完整網址</text>
  <text class="gatetxt" x="796" y="362">快取接在題目前面一起判讀</text>

  <!-- 快取接到題目 -->
  <path class="aiflow" d="M1115,232 L1115,318 L976,318" marker-end="url(#arrow2)"/>

  <path class="flow" d="M875,382 L875,414" marker-end="url(#arrow)"/>

  <rect class="fact" x="780" y="420" width="190" height="84" rx="8"/>
  <rect class="facthead" x="780" y="420" width="190" height="34" rx="8"/>
  <rect class="facthead" x="780" y="440" width="190" height="14"/>
  <text class="facttitle" x="796" y="443">cache_runs</text>
  <text class="factline" x="796" y="480">輸入、命中、輸出 Token</text>

  <rect class="gate" x="1020" y="420" width="190" height="84" rx="6"/>
  <text class="aititle" x="1036" y="448">④ 用完就刪</text>
  <text class="gatetxt" x="1036" y="472">cache.sh delete</text>
  <text class="gatetxt" x="1036" y="494">不再收儲存費</text>
  <path class="aiflow" d="M1180,414 L1180,232" stroke-dasharray="5 4" marker-end="url(#arrow2)"/>

  <!-- 對照面板 -->
  <rect class="panel" x="30" y="404" width="700" height="126" rx="8"/>
  <text class="colhead" x="50" y="430">同樣 4 題 × 3 輪（12 題）的費用，約新台幣</text>
  <text class="barlabel" x="50" y="462">數字在前</text>
  <rect class="bar-old" x="190" y="450" width="380" height="16" rx="3"/>
  <text class="barval" x="580" y="463">0.86 元　命中 0 題</text>
  <text class="barlabel" x="50" y="488">固定內容在前</text>
  <rect class="bar-new" x="190" y="476" width="362" height="16" rx="3"/>
  <text class="barval" x="562" y="489">0.82 元　命中 1 題</text>
  <text class="barlabel" x="50" y="514">明確快取</text>
  <rect class="bar-exp" x="190" y="502" width="133" height="16" rx="3"/>
  <text class="barval" x="333" y="515">0.30 元　命中 12 題（含建立與儲存費）</text>

  <!-- 圖例 -->
  <rect class="fact" x="30" y="556" width="22" height="16" rx="3"/>
  <text class="note" x="60" y="569">存成表，可以重複查詢</text>
  <rect class="step" x="250" y="556" width="22" height="16" rx="3"/>
  <text class="note" x="280" y="569">SQL 或指令步驟</text>
  <rect class="ai" x="440" y="556" width="22" height="16" rx="3"/>
  <text class="note" x="470" y="569">跟 Gemini 有關，依 Token 或存活時間計費</text>
  <text class="note" x="800" y="569">要問幾次才划得來只跟快取活多久有關</text>
</svg>
