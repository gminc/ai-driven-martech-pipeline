<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="1240" height="600" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #202124; }
      .zone { font-size: 14px; font-weight: 700; fill: #5f6368; }
      .note { font-size: 13px; fill: #5f6368; }
      .sys { fill: #f1f3f4; stroke: #dadce0; stroke-width: 1.2; }
      .user { fill: #ffffff; stroke: #1a73e8; stroke-width: 1.4; }
      .tool { fill: #fef7e0; stroke: #f29900; stroke-width: 1.4; }
      .ans { fill: #e6f4ea; stroke: #188038; stroke-width: 1.4; }
      .new { stroke-width: 2.6; }
      .t { font-size: 12.5px; fill: #3c4043; }
      .h { font-size: 14px; font-weight: 700; fill: #202124; }
      .big { font-size: 15px; font-weight: 700; fill: #1a73e8; }
      .lg { font-size: 12.5px; fill: #3c4043; }
      .flow { stroke: #1a73e8; stroke-width: 2.2; fill: none; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker>
  </defs>
  <rect width="1240" height="600" fill="#ffffff"/>
  <text x="40" y="44" class="title">Day 22｜模型沒有記憶，記憶是我們每一輪重送的那份對話紀錄</text>
  <text x="40" y="70" class="note">每一輪把新的內容接在同一份紀錄後面，整份再送給 Gemini，粗框是這一輪新接上去的</text>

  <text x="40" y="112" class="zone">第 1 輪送出去的</text>
  <text x="330" y="112" class="zone">第 3 輪送出去的</text>
  <text x="620" y="112" class="zone">第 5 輪送出去的</text>

  <!-- 第 1 輪 -->
  <rect x="40" y="124" width="250" height="44" rx="6" class="sys"/><text x="54" y="151" class="t">系統指示（今天的日期）＋四個工具定義</text>
  <rect x="40" y="174" width="250" height="30" rx="6" class="user new"/><text x="54" y="194" class="t">問：上週哪支廣告花最多錢？</text>
  <rect x="40" y="210" width="250" height="30" rx="6" class="tool new"/><text x="54" y="230" class="t">工具要求與結果：上週花費</text>
  <rect x="40" y="246" width="250" height="30" rx="6" class="ans new"/><text x="54" y="266" class="t">答：cr-meta-trn-p1，12,938 元</text>
  <text x="40" y="304" class="big">最後一次輸入 2,433 個 Token</text>

  <!-- 第 3 輪 -->
  <rect x="330" y="124" width="250" height="44" rx="6" class="sys"/><text x="344" y="151" class="t">系統指示（今天的日期）＋四個工具定義</text>
  <rect x="330" y="174" width="250" height="30" rx="6" class="user"/><text x="344" y="194" class="t">第 1 輪：問、工具結果、答</text>
  <rect x="330" y="210" width="250" height="30" rx="6" class="user"/><text x="344" y="230" class="t">第 2 輪：問、答（沒有查）</text>
  <rect x="330" y="246" width="250" height="30" rx="6" class="user new"/><text x="344" y="266" class="t">問：那再前一週呢？</text>
  <rect x="330" y="282" width="250" height="30" rx="6" class="tool new"/><text x="344" y="302" class="t">工具要求與結果：前一週花費</text>
  <rect x="330" y="318" width="250" height="30" rx="6" class="ans new"/><text x="344" y="338" class="t">答：一樣是它，14,328 元</text>
  <text x="330" y="376" class="big">最後一次輸入 4,584 個 Token</text>

  <!-- 第 5 輪 -->
  <rect x="620" y="124" width="250" height="44" rx="6" class="sys"/><text x="634" y="151" class="t">系統指示（今天的日期）＋四個工具定義</text>
  <rect x="620" y="174" width="250" height="30" rx="6" class="user"/><text x="634" y="194" class="t">第 1 輪：問、工具結果、答</text>
  <rect x="620" y="210" width="250" height="30" rx="6" class="user"/><text x="634" y="230" class="t">第 2 輪：問、答（沒有查）</text>
  <rect x="620" y="246" width="250" height="30" rx="6" class="user"/><text x="634" y="266" class="t">第 3 輪：問、工具結果、答</text>
  <rect x="620" y="282" width="250" height="30" rx="6" class="user"/><text x="634" y="302" class="t">第 4 輪：問、兩份工具結果、答</text>
  <rect x="620" y="318" width="250" height="30" rx="6" class="user new"/><text x="634" y="338" class="t">問：幫我整理成三點</text>
  <rect x="620" y="354" width="250" height="30" rx="6" class="ans new"/><text x="634" y="374" class="t">答：三點重點（沒有查）</text>
  <text x="620" y="412" class="big">輸入 6,195 個 Token</text>

  <!-- Gemini 與工具 -->
  <rect x="940" y="124" width="260" height="150" rx="10" class="user"/>
  <text x="958" y="154" class="h">Gemini（gemini-3.6-flash）</text>
  <text x="958" y="180" class="t">每一次呼叫都是獨立的</text>
  <text x="958" y="200" class="t">把整份紀錄從頭讀完才回答</text>
  <text x="958" y="232" class="t">「它」「前一週」聽得懂</text>
  <text x="958" y="252" class="t">是因為前面幾輪都在紀錄裡</text>

  <rect x="940" y="304" width="260" height="142" rx="10" class="tool"/>
  <text x="958" y="334" class="h">四個查詢工具（BigQuery）</text>
  <text x="958" y="360" class="t">廣告花費（今天新增）</text>
  <text x="958" y="380" class="t">通路歸因、異常診斷、素材特徵</text>
  <text x="958" y="412" class="t">查過的結果留在紀錄裡</text>
  <text x="958" y="432" class="t">後面幾輪可以直接用，不用重查</text>

  <path d="M870,146 L936,146" class="flow" marker-end="url(#a)"/>

  <!-- 圖例與上限 -->
  <rect x="40" y="470" width="18" height="14" rx="3" class="sys"/><text x="66" y="482" class="lg">每次都要送的固定內容</text>
  <rect x="230" y="470" width="18" height="14" rx="3" class="user"/><text x="256" y="482" class="lg">問題與前幾輪的紀錄</text>
  <rect x="410" y="470" width="18" height="14" rx="3" class="tool"/><text x="436" y="482" class="lg">工具要求與結果</text>
  <rect x="560" y="470" width="18" height="14" rx="3" class="ans"/><text x="586" y="482" class="lg">回答</text>
  <text x="40" y="524" class="note">上限：每輪最多呼叫模型 4 次、每場最多 8 輪、每次輸入最多 8,000 個 Token，超過就請使用者開一場新的對話</text>
  <text x="40" y="548" class="note">一輪沒有成功時，這一輪接上去的內容會整輪拿掉，紀錄裡只留完整的來回</text>
</svg>
