<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" font-family="'Noto Sans TC','Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #202124; }
      .note { font-size: 13px; fill: #5f6368; }
      .box { fill: #f8f9fa; stroke: #9aa0a6; stroke-width: 1.4; }
      .card { fill: #ffffff; stroke: #dadce0; stroke-width: 1.4; }
      .hd { font-size: 13px; font-weight: 700; fill: #5f6368; }
      .tx { font-size: 14px; fill: #202124; }
      .mono { font-size: 13px; fill: #202124; font-family: 'Roboto Mono','Noto Sans Mono','Menlo',monospace; }
      .ok { fill: #e6f4ea; stroke: #188038; stroke-width: 1.4; }
      .okt { font-size: 13px; font-weight: 700; fill: #188038; }
      .bad { fill: #fce8e6; stroke: #c5221f; stroke-width: 1.4; }
      .badt { font-size: 13px; font-weight: 700; fill: #c5221f; }
      .skip { fill: #f1f3f4; stroke: #9aa0a6; stroke-width: 1.4; }
      .skipt { font-size: 13px; font-weight: 700; fill: #5f6368; }
      .row { stroke: #e8eaed; stroke-width: 1; }
      .sec { font-size: 15px; font-weight: 700; fill: #e37400; }
      .ans { font-size: 13.5px; fill: #202124; }
      .hl { fill: #fef7e0; stroke: #e37400; stroke-width: 1.6; }
    </style>
  </defs>
  <rect width="1240" height="760" fill="#ffffff"/>
  <text x="40" y="44" class="title">圖二：10/11 的四次執行，以及排程自己寫出來的那一份日報</text>
  <text x="40" y="68" class="note">每一小格是一題：綠色答完、紅色沒有答案、灰色沒有發問，最右邊是 Workflows 執行清單上顯示的狀態</text>

  <text x="60" y="112" class="hd">台北時間</text>
  <text x="170" y="112" class="hd">怎麼啟動</text>
  <text x="520" y="112" class="hd">第 1 題</text>
  <text x="620" y="112" class="hd">第 2 題</text>
  <text x="720" y="112" class="hd">第 3 題</text>
  <text x="830" y="112" class="hd">花了多久</text>
  <text x="930" y="112" class="hd">呼叫模型</text>
  <text x="1030" y="112" class="hd">新台幣</text>
  <text x="1110" y="112" class="hd">執行狀態</text>
  <line x1="40" y1="124" x2="1200" y2="124" class="row"/>

  <text x="60" y="158" class="mono">16:25</text>
  <text x="170" y="158" class="tx">手動，三題都改打不存在的路徑（不花錢）</text>
  <rect x="512" y="138" width="84" height="30" rx="6" class="bad"/><text x="554" y="158" text-anchor="middle" class="badt">404</text>
  <rect x="612" y="138" width="84" height="30" rx="6" class="bad"/><text x="654" y="158" text-anchor="middle" class="badt">404</text>
  <rect x="712" y="138" width="84" height="30" rx="6" class="bad"/><text x="754" y="158" text-anchor="middle" class="badt">404</text>
  <text x="830" y="158" class="mono">15.1 秒</text>
  <text x="930" y="158" class="mono">0 次</text>
  <text x="1030" y="158" class="mono">0</text>
  <text x="1110" y="158" class="badt">失敗</text>
  <line x1="40" y1="180" x2="1200" y2="180" class="row"/>

  <rect x="44" y="186" width="1152" height="46" rx="8" class="hl"/>
  <text x="60" y="214" class="mono">16:32</text>
  <text x="170" y="214" class="tx">Cloud Scheduler 自己觸發</text>
  <rect x="512" y="194" width="84" height="30" rx="6" class="ok"/><text x="554" y="214" text-anchor="middle" class="okt">答完</text>
  <rect x="612" y="194" width="84" height="30" rx="6" class="ok"/><text x="654" y="214" text-anchor="middle" class="okt">答完</text>
  <rect x="712" y="194" width="84" height="30" rx="6" class="ok"/><text x="754" y="214" text-anchor="middle" class="okt">答完</text>
  <text x="830" y="214" class="mono">33.2 秒</text>
  <text x="930" y="214" class="mono">7 次</text>
  <text x="1030" y="214" class="mono">0.52</text>
  <text x="1110" y="214" class="okt">成功</text>
  <line x1="40" y1="236" x2="1200" y2="236" class="row"/>

  <text x="60" y="270" class="mono">16:34</text>
  <text x="170" y="270" class="tx">手動，不帶參數（今天已經有完整的日報）</text>
  <rect x="512" y="250" width="84" height="30" rx="6" class="skip"/><text x="554" y="270" text-anchor="middle" class="skipt">沒問</text>
  <rect x="612" y="250" width="84" height="30" rx="6" class="skip"/><text x="654" y="270" text-anchor="middle" class="skipt">沒問</text>
  <rect x="712" y="250" width="84" height="30" rx="6" class="skip"/><text x="754" y="270" text-anchor="middle" class="skipt">沒問</text>
  <text x="830" y="270" class="mono">1.4 秒</text>
  <text x="930" y="270" class="mono">0 次</text>
  <text x="1030" y="270" class="mono">0</text>
  <text x="1110" y="270" class="okt">成功</text>
  <line x1="40" y1="292" x2="1200" y2="292" class="row"/>

  <text x="60" y="326" class="mono">16:36</text>
  <text x="170" y="326" class="tx">手動，第 2 題故意失敗</text>
  <rect x="512" y="306" width="84" height="30" rx="6" class="ok"/><text x="554" y="326" text-anchor="middle" class="okt">答完</text>
  <rect x="612" y="306" width="84" height="30" rx="6" class="bad"/><text x="654" y="326" text-anchor="middle" class="badt">404</text>
  <rect x="712" y="306" width="84" height="30" rx="6" class="ok"/><text x="754" y="326" text-anchor="middle" class="okt">答完</text>
  <text x="830" y="326" class="mono">36.7 秒</text>
  <text x="930" y="326" class="mono">4 次</text>
  <text x="1030" y="326" class="mono">0.33</text>
  <text x="1110" y="326" class="badt">失敗</text>
  <line x1="40" y1="348" x2="1200" y2="348" class="row"/>
  <text x="60" y="374" class="note">合計呼叫模型 11 次、新台幣 0.86 元，16:34 那一次查到今天已經有日報就結束，助理一次都沒有被呼叫</text>

  <rect x="40" y="400" width="1160" height="332" rx="10" class="card"/>
  <text x="62" y="434" class="title" font-size="18">2026-10-11 的行銷日報（16:32 排程那一次，三題的回答原文）</text>
  <text x="62" y="456" class="note">資料停在 2026-09-16，助理把隔天當成今天，所以上週是 9/7 到 9/13</text>

  <text x="62" y="494" class="sec">1　上週花費</text>
  <text x="62" y="518" class="ans">上週（2026/09/07 至 2026/09/13）全站廣告費用總計為 123,957 元。其中花最多錢的廣告素材是 cr-meta-trn-p1，累計花費 12,938 元。</text>

  <text x="62" y="558" class="sec">2　通路功勞</text>
  <text x="62" y="582" class="ans">上週（2026/09/07 至 2026/09/13）分到最多訂單功勞的通路是 newsletter / email。採用時間衰減模型計算，前三名分別為：</text>
  <text x="62" y="604" class="ans">1. newsletter / email：97.1 筆訂單（佔 22.75%）　2. (direct) / (none)：85 筆訂單（佔 19.9%）　3. meta / paid_social：79.9 筆訂單（佔 18.71%）</text>

  <text x="62" y="644" class="sec">3　成效異常</text>
  <text x="62" y="668" class="ans">廣告成效曾出現過 4 次異常紀錄，包含素材疲乏、競價變貴與追蹤碼失效等狀況。最需要注意的是 2026-08-27 的「全站追蹤碼失效」事件，</text>
  <text x="62" y="690" class="ans">其判讀信心度高達 0.95。原因為當天廣告點擊數（1,386 次）與後台訂單（37 筆）皆維持正常，但網站追蹤到的購買數卻驟降為 0 筆，</text>
  <text x="62" y="712" class="ans">導致追蹤營收 ROAS 歸零。</text>
</svg>
