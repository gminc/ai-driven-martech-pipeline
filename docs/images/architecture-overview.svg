<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a73e8"/>
      <stop offset="100%" stop-color="#4285f4"/>
    </linearGradient>
    <linearGradient id="header-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#1a73e8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1a73e8"/>
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="30" y="20" width="900" height="55" rx="8" fill="url(#header-grad)" filter="url(#shadow)"/>
  <text x="480" y="55" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="1">AI-Driven MarTech 系統總體架構全景圖</text>

  <!-- Layer 1: Dual Track Event Ingestion -->
  <g transform="translate(30, 95)">
    <rect width="900" height="105" rx="10" fill="#f8fafd" stroke="#d2e3fc" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="15" y="-12" width="180" height="24" rx="4" fill="#1a73e8"/>
    <text x="105" y="4" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">1. 雙軌資料收集層</text>
    
    <!-- Track A -->
    <rect x="30" y="25" width="250" height="60" rx="6" fill="#ffffff" stroke="#1a73e8" stroke-width="1.2"/>
    <text x="155" y="48" text-anchor="middle" fill="#202124" font-size="13" font-weight="600">軌道 A：極簡 Live Demo 站</text>
    <text x="155" y="68" text-anchor="middle" fill="#5f6368" font-size="11">Firebase Hosting + GA4 + Stripe</text>

    <!-- Arrow -->
    <path d="M 285 55 L 340 55" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="312" y="48" text-anchor="middle" fill="#1a73e8" font-size="10" font-weight="600">即時串流</text>

    <!-- Track B -->
    <rect x="345" y="25" width="250" height="60" rx="6" fill="#ffffff" stroke="#1a73e8" stroke-width="1.2"/>
    <text x="470" y="48" text-anchor="middle" fill="#202124" font-size="13" font-weight="600">軌道 B：Python 數據合成器</text>
    <text x="470" y="68" text-anchor="middle" fill="#5f6368" font-size="11">90 天 / 50 萬筆真實統計日誌</text>

    <!-- Arrow -->
    <path d="M 600 55 L 655 55" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="627" y="48" text-anchor="middle" fill="#1a73e8" font-size="10" font-weight="600">批次載入</text>

    <!-- Hub Box -->
    <rect x="660" y="25" width="210" height="60" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.2"/>
    <text x="765" y="48" text-anchor="middle" fill="#1967d2" font-size="13" font-weight="700">雙軌匯流檢驗閥</text>
    <text x="765" y="68" text-anchor="middle" fill="#5f6368" font-size="11">驗證真實連通 + 大數據規模</text>
  </g>

  <!-- Flow Arrow Down 1 -> 2 -->
  <path d="M 480 205 L 480 225" stroke="#1a73e8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Layer 2: BigQuery Modern DW & Modeling -->
  <g transform="translate(30, 230)">
    <rect width="900" height="105" rx="10" fill="#f8fafd" stroke="#d2e3fc" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="15" y="-12" width="200" height="24" rx="4" fill="#1a73e8"/>
    <text x="115" y="4" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">2. BigQuery 現代倉儲建模層</text>
    
    <!-- BigQuery Core -->
    <rect x="30" y="25" width="260" height="60" rx="6" fill="#ffffff" stroke="#1a73e8" stroke-width="1.2"/>
    <text x="160" y="48" text-anchor="middle" fill="#202124" font-size="13" font-weight="600">Google BigQuery 星狀綱要</text>
    <text x="160" y="68" text-anchor="middle" fill="#5f6368" font-size="11">分區 (Partition) + 分群 (Cluster)</text>

    <path d="M 295 55 L 340 55" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- MTA Attribution -->
    <rect x="345" y="25" width="260" height="60" rx="6" fill="#ffffff" stroke="#1a73e8" stroke-width="1.2"/>
    <text x="475" y="48" text-anchor="middle" fill="#202124" font-size="13" font-weight="600">多觸點歸因 (MTA) 引擎</text>
    <text x="475" y="68" text-anchor="middle" fill="#5f6368" font-size="11">First / Last / Time-Decay 模型</text>

    <path d="M 610 55 L 655 55" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- BigQuery ML -->
    <rect x="660" y="25" width="210" height="60" rx="6" fill="#ffffff" stroke="#1a73e8" stroke-width="1.2"/>
    <text x="765" y="48" text-anchor="middle" fill="#202124" font-size="13" font-weight="600">BigQuery ML 機器學習</text>
    <text x="765" y="68" text-anchor="middle" fill="#5f6368" font-size="11">K-means 分群 + 顧客 LTV 預測</text>
  </g>

  <!-- Flow Arrow Down 2 -> 3 -->
  <path d="M 480 340 L 480 360" stroke="#1a73e8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Layer 3: Vertex AI Multimodal Creative Analysis -->
  <g transform="translate(30, 365)">
    <rect width="900" height="105" rx="10" fill="#f8fafd" stroke="#d2e3fc" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="15" y="-12" width="210" height="24" rx="4" fill="#1a73e8"/>
    <text x="120" y="4" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">3. Vertex AI 多模態素材分析層</text>
    
    <!-- Cloud Storage -->
    <rect x="30" y="25" width="250" height="60" rx="6" fill="#ffffff" stroke="#1a73e8" stroke-width="1.2"/>
    <text x="155" y="48" text-anchor="middle" fill="#202124" font-size="13" font-weight="600">廣告素材儲存庫 (GCS)</text>
    <text x="155" y="68" text-anchor="middle" fill="#5f6368" font-size="11">跨通路圖文素材批次託管</text>

    <path d="M 285 55 L 340 55" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Gemini 1.5 Vision -->
    <rect x="345" y="25" width="255" height="60" rx="6" fill="#ffffff" stroke="#1a73e8" stroke-width="1.2"/>
    <text x="472" y="48" text-anchor="middle" fill="#202124" font-size="13" font-weight="600">Gemini 1.5 Vision 視覺解析</text>
    <text x="472" y="68" text-anchor="middle" fill="#5f6368" font-size="11">色調 / 排版 / 表情 / CTA 抽取</text>

    <path d="M 605 55 L 655 55" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Structured Outputs -->
    <rect x="660" y="25" width="210" height="60" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.2"/>
    <text x="765" y="48" text-anchor="middle" fill="#1967d2" font-size="13" font-weight="700">特徵 × 成效矩陣</text>
    <text x="765" y="68" text-anchor="middle" fill="#5f6368" font-size="11">Structured Outputs 結構化入庫</text>
  </g>

  <!-- Flow Arrow Down 3 -> 4 -->
  <path d="M 480 475 L 480 495" stroke="#1a73e8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Layer 4: Automated Agent Loop & Ops -->
  <g transform="translate(30, 500)">
    <rect width="900" height="100" rx="10" fill="#f8fafd" stroke="#d2e3fc" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="15" y="-12" width="210" height="24" rx="4" fill="#1a73e8"/>
    <text x="120" y="4" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">4. 智慧決策代理人與閉環層</text>
    
    <!-- Agent on Cloud Run -->
    <rect x="30" y="22" width="250" height="58" rx="6" fill="#ffffff" stroke="#1a73e8" stroke-width="1.2"/>
    <text x="155" y="44" text-anchor="middle" fill="#202124" font-size="13" font-weight="600">行銷決策 Agent (Cloud Run)</text>
    <text x="155" y="63" text-anchor="middle" fill="#5f6368" font-size="11">Function Calling 查指標與素材</text>

    <path d="M 285 51 L 340 51" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Workflows -->
    <rect x="345" y="22" width="255" height="58" rx="6" fill="#ffffff" stroke="#1a73e8" stroke-width="1.2"/>
    <text x="472" y="44" text-anchor="middle" fill="#202124" font-size="13" font-weight="600">Cloud Workflows 任務編排</text>
    <text x="472" y="63" text-anchor="middle" fill="#5f6368" font-size="11">每日成效自動巡檢與警報觸發</text>

    <path d="M 605 51 L 655 51" stroke="#1a73e8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Slack Loop -->
    <rect x="660" y="22" width="210" height="58" rx="6" fill="#e8f0fe" stroke="#1a73e8" stroke-width="1.2"/>
    <text x="765" y="44" text-anchor="middle" fill="#1967d2" font-size="13" font-weight="700">Slack 智慧警報閉環</text>
    <text x="765" y="63" text-anchor="middle" fill="#5f6368" font-size="11">自動推播異動診斷與改版提案</text>
  </g>
</svg>