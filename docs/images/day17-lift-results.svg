  <text x="40" y="550" class="note">倍數＝同一個通路、同一群受眾裡，有這個特徵的圖除以沒有的，四組再加權合併，橫軸是對數刻度，虛線是 ×1（沒有差別）</text>
  <text x="40" y="574" class="note">點擊率三個特徵都有效果、文字多看不出差別，轉換率四個都看不出差別，所以每次曝光的成交差別幾乎都來自點擊率</text>
