  <rect width="1240" height="640" fill="#ffffff"/>
  <text x="40" y="44" class="title">Day 17｜有沒有這個特徵的圖差幾倍（同通路、同受眾分層）</text>
  <text x="40" y="70" class="sub">23 張圖片素材，藍色＝有差別（轉換率與成交看 95% 信賴區間是否包含 1，點擊率看是否過判準 1.05），灰色＝看不出差別</text>
  <text x="250" y="112" class="ph">點擊率</text>
