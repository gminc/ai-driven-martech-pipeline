<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .outer { fill: none; stroke: #e0e6ed; stroke-width: 1.5; }
      .title { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Noto Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif; font-weight: 700; font-size: 22px; fill: #1a73e8; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Noto Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif; font-size: 13.5px; fill: #5f6368; }
      .card { fill: #ffffff; stroke: #e0e6ed; stroke-width: 1.5; }
      .card-accent { fill: #ffffff; stroke: #1a73e8; stroke-width: 1.8; }
      .head { fill: #f1f5fb; }
      .head-accent { fill: #e8f0fe; }
      .badge { fill: #1a73e8; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Noto Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif; font-weight: 700; font-size: 12px; fill: #ffffff; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Noto Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif; font-weight: 700; font-size: 15px; fill: #202124; }
      .body { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Noto Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif; font-size: 12.5px; fill: #3c4043; }
      .muted { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Noto Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif; font-size: 11.5px; fill: #5f6368; }
      .code { font-family: &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, Menlo, monospace; font-size: 12px; fill: #1557b0; }
      .check { fill: #e6f4ea; stroke: #188038; stroke-width: 1; }
      .check-text { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Noto Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif; font-weight: 600; font-size: 12px; fill: #137333; }
      .stop { fill: #fce8e6; stroke: #d93025; stroke-width: 1; stroke-dasharray: 5,4; }
      .stop-text { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Noto Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif; font-size: 12px; fill: #a50e0e; }
      .arrow { stroke: #1a73e8; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrowhead { fill: #1a73e8; }
      .table { fill: #f8fafd; stroke: #e0e6ed; stroke-width: 1; }
      .table-name { font-family: &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, Menlo, monospace; font-size: 12px; font-weight: 700; fill: #202124; }
      .num { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Noto Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif; font-size: 12px; fill: #3c4043; }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="560"/>
  <rect class="outer" x="10" y="10" width="1180" height="540" rx="14"/>
  <text class="title" x="40" y="54">Day 06 合成器量產：從 CSV 到 BigQuery 的四個檢查點</text>
  <text class="subtitle" x="40" y="80">每一步都有檢查點，前一步沒通過就不往下走，最後由本機與 BigQuery 兩邊各算一次指標對帳</text>
  <rect class="card" x="40" y="108" width="250" height="236" rx="10"/>
  <path class="head" d="M41,118 a9,9 0 0 1 9,-9 h230 a9,9 0 0 1 9,9 v38 h-248 z"/>
  <circle class="badge" cx="66" cy="133" r="12"/><text class="badge-text" x="66" y="137">1</text>
  <text class="card-title" x="86" y="138">產生</text>
  <text class="code" x="58" y="182">synthetic_pipeline.py</text>
  <text class="body" x="58" y="212">固定種子 20260919</text>
  <text class="body" x="58" y="236">90 天、5 份 CSV</text>
  <text class="body" x="58" y="260">約 70 MB</text>
  <rect class="check" x="54" y="294" width="222" height="34" rx="6"/>
  <text class="check-text" x="165.0" y="316" text-anchor="middle">檢查點：同一種子檔案完全相同</text>
  <line class="arrow" x1="294" y1="226.0" x2="324" y2="226.0" marker-end="url(#ah)"/>
  <rect class="card" x="330" y="108" width="250" height="236" rx="10"/>
  <path class="head" d="M331,118 a9,9 0 0 1 9,-9 h230 a9,9 0 0 1 9,9 v38 h-248 z"/>
  <circle class="badge" cx="356" cy="133" r="12"/><text class="badge-text" x="356" y="137">2</text>
  <text class="card-title" x="376" y="138">本機驗證</text>
  <text class="code" x="348" y="182">validate.py</text>
  <text class="body" x="348" y="212">完整性、統計目標</text>
  <text class="body" x="348" y="236">與七個訊號</text>
  <text class="body" x="348" y="260">共 32 項檢查</text>
  <rect class="check" x="344" y="294" width="222" height="34" rx="6"/>
  <text class="check-text" x="455.0" y="316" text-anchor="middle">檢查點：全部 PASS 才准許載入</text>
  <line class="arrow" x1="584" y1="226.0" x2="614" y2="226.0" marker-end="url(#ah)"/>
  <rect class="card-accent" x="620" y="108" width="250" height="236" rx="10"/>
  <path class="head-accent" d="M621,118 a9,9 0 0 1 9,-9 h230 a9,9 0 0 1 9,9 v38 h-248 z"/>
  <circle class="badge" cx="646" cy="133" r="12"/><text class="badge-text" x="646" y="137">3</text>
  <text class="card-title" x="666" y="138">批次載入</text>
  <text class="code" x="638" y="182">load.sh + schemas/</text>
  <text class="body" x="638" y="212">五份綱要檔指定型別</text>
  <text class="body" x="638" y="236">覆寫模式可重跑</text>
  <text class="body" x="638" y="260">批次載入不收費</text>
  <rect class="check" x="634" y="294" width="222" height="34" rx="6"/>
  <text class="check-text" x="745.0" y="316" text-anchor="middle">檢查點：標題順序與列數一致</text>
  <line class="arrow" x1="874" y1="226.0" x2="904" y2="226.0" marker-end="url(#ah)"/>
  <rect class="card-accent" x="910" y="108" width="250" height="236" rx="10"/>
  <path class="head-accent" d="M911,118 a9,9 0 0 1 9,-9 h230 a9,9 0 0 1 9,9 v38 h-248 z"/>
  <circle class="badge" cx="936" cy="133" r="12"/><text class="badge-text" x="936" y="137">4</text>
  <text class="card-title" x="956" y="138">兩邊對帳</text>
  <text class="code" x="928" y="182">reconcile.py ↔ verify.sql</text>
  <text class="body" x="928" y="212">本機 Python 讀 CSV</text>
  <text class="body" x="928" y="236">BigQuery SQL 查表</text>
  <text class="body" x="928" y="260">各算同一份指標</text>
  <rect class="check" x="924" y="294" width="222" height="34" rx="6"/>
  <text class="check-text" x="1035.0" y="316" text-anchor="middle">檢查點：55 項指標全部一致</text>
  <rect class="card-accent" x="40" y="380" width="860" height="140" rx="10"/>
  <text class="card-title" x="60" y="410">martech_dw（US 多區域）五張 raw 表</text>
  <text class="muted" x="60" y="430">分區與叢集留給 Day 07，合計約 63.5 MiB，在每月 10 GiB 免費儲存額度內</text>
  <rect class="table" x="60" y="446" width="152" height="56" rx="6"/>
  <text class="table-name" x="136.0" y="469" text-anchor="middle">raw_creatives</text>
  <text class="num" x="136.0" y="490" text-anchor="middle">30 列</text>
  <rect class="table" x="222" y="446" width="152" height="56" rx="6"/>
  <text class="table-name" x="298.0" y="469" text-anchor="middle">raw_ad_daily</text>
  <text class="num" x="298.0" y="490" text-anchor="middle">1,700 列</text>
  <rect class="table" x="384" y="446" width="152" height="56" rx="6"/>
  <text class="table-name" x="460.0" y="469" text-anchor="middle">raw_events</text>
  <text class="num" x="460.0" y="490" text-anchor="middle">524,020 列</text>
  <rect class="table" x="546" y="446" width="152" height="56" rx="6"/>
  <text class="table-name" x="622.0" y="469" text-anchor="middle">raw_orders</text>
  <text class="num" x="622.0" y="490" text-anchor="middle">3,304 列</text>
  <rect class="table" x="708" y="446" width="152" height="56" rx="6"/>
  <text class="table-name" x="784.0" y="469" text-anchor="middle">raw_customers</text>
  <text class="num" x="784.0" y="490" text-anchor="middle">2,461 列</text>
  <line class="arrow" x1="745.0" y1="348" x2="745.0" y2="374" marker-end="url(#ah)"/>
  <rect class="stop" x="930" y="380" width="230" height="140" rx="10"/>
  <text class="card-title" x="950" y="412">答案表不進倉儲</text>
  <text class="stop-text" x="950" y="442">ground_truth/ 只留在本機</text>
  <text class="stop-text" x="950" y="466">S5 顧客類型只在本機檢查</text>
  <text class="stop-text" x="950" y="490">倉儲只放分析看得到的資料</text>
</svg>
