<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font-size: 22px; font-weight: 700; fill: #202124; }
      .colhead { font-size: 15px; font-weight: 700; fill: #5f6368; }
      .raw { fill: #f1f3f4; stroke: #dadce0; stroke-width: 1.2; }
      .rawtxt { font-size: 14px; fill: #3c4043; }
      .step { fill: #ffffff; stroke: #1a73e8; stroke-width: 1.4; }
      .steptitle { font-size: 15px; font-weight: 700; fill: #1a73e8; }
      .stepline { font-size: 13px; fill: #3c4043; }
      .sub { font-size: 12.5px; fill: #5f6368; }
      .fact { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 1.6; }
      .facthead { fill: #1a73e8; }
      .facttitle { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .factline { font-size: 13px; fill: #174ea6; }
      .ai { fill: #fef7e0; stroke: #f29900; stroke-width: 1.8; }
      .aititle { font-size: 15px; font-weight: 700; fill: #b06000; }
      .ailine { font-size: 13px; fill: #5f4100; }
      .gate { fill: #ffffff; stroke: #f29900; stroke-width: 1.3; stroke-dasharray: 5 4; }
      .gatetxt { font-size: 12.5px; fill: #b06000; }
      .flow { stroke: #1a73e8; stroke-width: 2.2; fill: none; }
      .aiflow { stroke: #f29900; stroke-width: 2.2; fill: none; }
      .note { font-size: 13px; fill: #5f6368; }
      .arrowhead { fill: #1a73e8; }
      .arrowhead2 { fill: #f29900; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrowhead2" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1240" height="560"/>
  <text class="title" x="30" y="44">Day 09 成效異常診斷：SQL 先找出哪裡變了，再請 Gemini 判讀原因</text>

  <!-- 來源 -->
  <text class="colhead" x="30" y="92">事實表（Day 07）</text>
  <rect class="raw" x="30" y="108" width="190" height="44" rx="6"/><text class="rawtxt" x="46" y="135">fct_ad_daily</text>
  <rect class="raw" x="30" y="164" width="190" height="44" rx="6"/><text class="rawtxt" x="46" y="191">fct_events</text>
  <rect class="raw" x="30" y="220" width="190" height="44" rx="6"/><text class="rawtxt" x="46" y="247">fct_orders</text>
  <text class="sub" x="30" y="290">52 萬筆事件、3,304 筆訂單</text>

  <path class="flow" d="M226,186 L262,186" marker-end="url(#arrow)"/>

  <!-- ① 找異常 -->
  <rect class="step" x="270" y="100" width="236" height="188" rx="8"/>
  <text class="steptitle" x="286" y="128">① 找異常　summary.sql</text>
  <text class="stepline" x="286" y="160">廣告群組每週</text>
  <text class="sub" x="300" y="180">點擊成本、點擊率 vs 前四週</text>
  <text class="stepline" x="286" y="208">素材每週</text>
  <text class="sub" x="300" y="228">點擊率 vs 最早 14 天</text>
  <text class="stepline" x="286" y="256">全站每天</text>
  <text class="sub" x="300" y="276">追蹤購買 vs 後台訂單</text>

  <path class="flow" d="M512,194 L548,194" marker-end="url(#arrow)"/>

  <!-- diag_summary -->
  <rect class="fact" x="556" y="140" width="170" height="108" rx="8"/>
  <rect class="facthead" x="556" y="140" width="170" height="34" rx="8"/>
  <rect class="facthead" x="556" y="160" width="170" height="14"/>
  <text class="facttitle" x="572" y="163">diag_summary</text>
  <text class="factline" x="572" y="200">超過門檻才留下</text>
  <text class="factline" x="572" y="226">今天只有 4 列</text>

  <path class="flow" d="M732,194 L768,194" marker-end="url(#arrow)"/>

  <!-- ② 寫題目 -->
  <rect class="step" x="776" y="140" width="176" height="108" rx="8"/>
  <text class="steptitle" x="792" y="168">② 寫題目</text>
  <text class="stepline" x="792" y="196">diag_prompt 檢視表</text>
  <text class="sub" x="792" y="220">數字＋六個候選原因</text>
  <text class="sub" x="792" y="240">不寫判斷規則</text>

  <!-- 呼叫前關卡 -->
  <rect class="gate" x="776" y="268" width="176" height="62" rx="6"/>
  <text class="gatetxt" x="790" y="292">cost.sql 先數 Token</text>
  <text class="gatetxt" x="790" y="314">印出最壞費用，yes 才呼叫</text>

  <path class="aiflow" d="M958,194 L994,194" marker-end="url(#arrow2)"/>

  <!-- ③ 問 Gemini -->
  <rect class="ai" x="1002" y="100" width="210" height="188" rx="8"/>
  <text class="aititle" x="1018" y="128">③ 問 Gemini</text>
  <text class="ailine" x="1018" y="160">AI.GENERATE_TEXT</text>
  <text class="ailine" x="1018" y="188">遠端模型</text>
  <text class="ailine" x="1032" y="210">gemini_flash_lite</text>
  <text class="ailine" x="1032" y="230">gemini_flash</text>
  <text class="ailine" x="1018" y="258">連線 us.vertex_ai_conn</text>
  <text class="gatetxt" x="1018" y="280">只有這一步會花錢</text>

  <path class="aiflow" d="M1107,294 L1107,344" marker-end="url(#arrow2)"/>

  <!-- mart_diagnosis -->
  <rect class="fact" x="1002" y="352" width="210" height="124" rx="8"/>
  <rect class="facthead" x="1002" y="352" width="210" height="34" rx="8"/>
  <rect class="facthead" x="1002" y="372" width="210" height="14"/>
  <text class="facttitle" x="1018" y="375">mart_diagnosis</text>
  <text class="factline" x="1018" y="410">原因（六選一）</text>
  <text class="factline" x="1018" y="434">證據、信心分數</text>
  <text class="factline" x="1018" y="458">下一步要查什麼</text>

  <path class="flow" d="M996,414 L960,414" marker-end="url(#arrow)"/>

  <!-- ④ 驗答案 -->
  <rect class="step" x="776" y="360" width="176" height="108" rx="8"/>
  <text class="steptitle" x="792" y="388">④ 驗答案</text>
  <text class="stepline" x="792" y="416">check.sql 16 項</text>
  <text class="sub" x="792" y="440">JSON 完整、原因在選項內</text>
  <text class="sub" x="792" y="460">再和答案表比對</text>

  <!-- 圖例 -->
  <rect class="fact" x="30" y="506" width="22" height="16" rx="3"/>
  <text class="note" x="60" y="519">存成表，可以重複查詢</text>
  <rect class="step" x="250" y="506" width="22" height="16" rx="3"/>
  <text class="note" x="280" y="519">SQL 步驟，只花 BigQuery 免費額度</text>
  <rect class="ai" x="540" y="506" width="22" height="16" rx="3"/>
  <text class="note" x="570" y="519">呼叫 Gemini，依 Token 計費</text>
  <text class="note" x="30" y="545">算數字交給 SQL，判讀交給 AI：52 萬筆事件先壓成 4 列，每列不到 500 個 Token 才送出</text>
</svg>
