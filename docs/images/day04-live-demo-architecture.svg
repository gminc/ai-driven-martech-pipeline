<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620">
  <defs>
    <style>
      .bg { fill: #f8fafd; }
      .outer { fill: none; stroke: #e0e6ed; stroke-width: 1.5; }
      .title { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Noto Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif; font-weight: 700; font-size: 22px; fill: #1a73e8; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Noto Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif; font-size: 13.5px; fill: #5f6368; }
      .card { fill: #ffffff; stroke: #e0e6ed; stroke-width: 1.5; }
      .card-accent { fill: #ffffff; stroke: #1a73e8; stroke-width: 1.8; }
      .head { fill: #f1f5fb; }
      .head-accent { fill: #e8f0fe; }
      .badge { fill: #1a73e8; }
      .badge-green { fill: #188038; }
      .badge-warn { fill: #f29900; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Noto Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif; font-weight: 700; font-size: 11px; fill: #ffffff; text-anchor: middle; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Noto Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif; font-weight: 700; font-size: 15px; fill: #202124; }
      .label { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Noto Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif; font-weight: 600; font-size: 12.5px; fill: #202124; }
      .body { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Noto Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif; font-size: 12px; fill: #3c4043; }
      .muted { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Noto Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif; font-size: 11px; fill: #5f6368; }
      .code { font-family: &quot;SFMono-Regular&quot;, Consolas, &quot;Liberation Mono&quot;, Menlo, monospace; font-size: 11.5px; fill: #1557b0; }
      .inner { fill: #f8fafd; stroke: #e0e6ed; stroke-width: 1; }
      .inner-accent { fill: #f1f5fb; stroke: #1a73e8; stroke-width: 1; }
      .inner-green { fill: #e6f4ea; stroke: #188038; stroke-width: 1; }
      .inner-danger { fill: #fce8e6; stroke: #d93025; stroke-width: 1; }
      .arrow { stroke: #1a73e8; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-green { stroke: #188038; stroke-width: 2; stroke-dasharray: 6,4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-label { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Noto Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif; font-weight: 600; font-size: 11.5px; fill: #1a73e8; text-anchor: middle; }
      .arrow-label-green { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Noto Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif; font-weight: 600; font-size: 11.5px; fill: #188038; text-anchor: middle; }
      .foot { fill: #ffffff; stroke: #e0e6ed; stroke-width: 1.2; }
      .foot-text { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Noto Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif; font-size: 12.5px; fill: #3c4043; }
      .danger-text { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Noto Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif; font-weight: 600; font-size: 12px; fill: #d93025; }
      .green-text { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, &quot;Noto Sans TC&quot;, &quot;PingFang TC&quot;, &quot;Microsoft JhengHei&quot;, sans-serif; font-weight: 600; font-size: 12px; fill: #188038; }
    </style>
    <marker id="ah" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#1a73e8"/></marker>
    <marker id="ahg" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#188038"/></marker>
  </defs>

  <rect width="1200" height="620" rx="12" class="bg"/>
  <rect x="1" y="1" width="1198" height="618" rx="12" class="outer"/>
  <text x="40" y="46" class="title">Day 04 Live Demo 站部署架構：Cloud Run 單一服務 + 綠界測試金流 + GA4</text>
  <text x="40" y="72" class="subtitle">一個容器同時負責商品頁、結帳簽章與付款通知；前端事件送往 GA4，每日匯出到 BigQuery 供後續歸因分析</text>
  <rect x="40" y="100" width="300" height="380" rx="8" class="card"/>
  <path d="M41 144 V109 a8 8 0 0 1 8 -8 H331 a8 8 0 0 1 8 8 V144 Z" class="head"/>
  <rect x="54" y="113" width="29.0" height="20" rx="4" class="badge"/>
  <text x="68.5" y="127" class="badge-text">訪客</text>
  <text x="93.0" y="128" class="card-title">瀏覽器（手機 / 桌機）</text>
  <rect x="58" y="164" width="264" height="60" rx="6" class="inner"/>
  <text x="72" y="188" class="label">首頁 / 品牌頁</text>
  <text x="72" y="209" class="muted">品牌故事、工藝主張、商品列表</text>
  <rect x="58" y="240" width="264" height="60" rx="6" class="inner"/>
  <text x="72" y="264" class="label">商品詳情頁 / 活動著陸頁</text>
  <text x="72" y="285" class="muted">多圖與規格；活動素材與 utm 來源</text>
  <rect x="58" y="316" width="264" height="60" rx="6" class="inner"/>
  <text x="72" y="340" class="label">analytics.js</text>
  <text x="72" y="361" class="muted">列表曝光 → 點擊 → 檢視 → 結帳</text>
  <rect x="58" y="392" width="264" height="60" rx="6" class="inner"/>
  <text x="72" y="416" class="label">結帳轉址頁 / 感謝頁</text>
  <text x="72" y="437" class="muted">簽章表單、驗證成功才送 purchase</text>
  <rect x="450" y="100" width="320" height="380" rx="8" class="card-accent"/>
  <path d="M451 144 V109 a8 8 0 0 1 8 -8 H761 a8 8 0 0 1 8 8 V144 Z" class="head-accent"/>
  <rect x="464" y="113" width="81.5" height="20" rx="4" class="badge"/>
  <text x="504.75" y="127" class="badge-text">Cloud Run</text>
  <text x="555.5" y="128" class="card-title">martech-live-demo</text>
  <text x="466" y="160" class="muted">asia-east1｜最少 0、最多 2 個執行個體</text>
  <rect x="468" y="176" width="284" height="52" rx="6" class="inner-accent"/>
  <text x="482" y="197" class="code">GET / ・/about</text>
  <text x="482" y="216" class="muted">品牌故事與商品列表</text>
  <rect x="468" y="238" width="284" height="52" rx="6" class="inner-accent"/>
  <text x="482" y="259" class="code">GET /product/&lt;商品&gt;・/lp/&lt;活動&gt;</text>
  <text x="482" y="278" class="muted">詳情頁與活動著陸頁</text>
  <rect x="468" y="300" width="284" height="52" rx="6" class="inner-accent"/>
  <text x="482" y="321" class="code">GET /checkout/&lt;商品&gt;</text>
  <text x="482" y="340" class="muted">伺服器算金額 + CheckMacValue</text>
  <rect x="468" y="362" width="284" height="52" rx="6" class="inner-accent"/>
  <text x="482" y="383" class="code">POST /ecpay/return ・/result</text>
  <text x="482" y="402" class="muted">驗章、回應 1|OK、輸出 purchase</text>
  <rect x="468" y="428" width="284" height="40" rx="6" class="inner"/>
  <text x="482" y="453" class="body">結構化 JSON 日誌 → Cloud Logging</text>
  <rect x="880" y="100" width="280" height="170" rx="8" class="card"/>
  <path d="M881 144 V109 a8 8 0 0 1 8 -8 H1151 a8 8 0 0 1 8 8 V144 Z" class="head"/>
  <rect x="894" y="113" width="29.0" height="20" rx="4" class="badge"/>
  <text x="908.5" y="127" class="badge-text">分析</text>
  <text x="933.0" y="128" class="card-title">GA4 → BigQuery</text>
  <text x="898" y="166" class="body">GA4 資源（評估 ID G-XXXXXXXXXX）</text>
  <text x="898" y="188" class="body">每日匯出：免費（每日 100 萬事件上限）</text>
  <rect x="898" y="200" width="244" height="56" rx="6" class="inner-accent"/>
  <text x="912" y="222" class="code">analytics_&lt;資源 ID&gt;</text>
  <text x="912" y="244" class="code">events_YYYYMMDD（US 多區域）</text>
  <rect x="880" y="290" width="280" height="190" rx="8" class="card"/>
  <path d="M881 334 V299 a8 8 0 0 1 8 -8 H1151 a8 8 0 0 1 8 8 V334 Z" class="head"/>
  <rect x="894" y="303" width="29.0" height="20" rx="4" class="badge-green"/>
  <text x="908.5" y="317" class="badge-text">金流</text>
  <text x="933.0" y="318" class="card-title">綠界 ECPay 測試環境</text>
  <text x="898" y="358" class="code">payment-stage.ecpay.com.tw</text>
  <text x="898" y="386" class="body">官方公開測試特店 3002607</text>
  <text x="898" y="410" class="body">測試卡號付款，不會實際扣款</text>
  <text x="898" y="434" class="muted">付款後回呼 ReturnURL</text>
  <text x="898" y="454" class="muted">與 OrderResultURL</text>
  <path d="M340 190 L450 190" class="arrow" marker-end="url(#ah)"/>
  <text x="395" y="180" class="arrow-label">HTTPS 瀏覽</text>
  <path d="M340 214 L450 262" class="arrow" marker-end="url(#ah)"/>
  <text x="408" y="226" class="arrow-label">前往結帳</text>
  <path d="M322 344 L360 344 L360 520 L1020 520 L1020 484" class="arrow" marker-end="url(#ah)"/>
  <text x="690" y="512" class="arrow-label">瀏覽器帶簽章表單 POST 到綠界</text>
  <path d="M880 326 L772 326" class="arrow-green" marker-end="url(#ahg)"/>
  <text x="826" y="318" class="arrow-label-green">伺服器通知</text>
  <path d="M880 388 L772 388" class="arrow-green" marker-end="url(#ahg)"/>
  <text x="826" y="380" class="arrow-label-green">導回瀏覽器</text>
  <path d="M190 100 L190 86 L1020 86 L1020 98" class="arrow" marker-end="url(#ah)"/>
  <text x="900" y="80" class="arrow-label">gtag 事件：瀏覽器直送 GA4</text>
  <rect x="40" y="548" width="1120" height="48" rx="6" class="foot"/>
  <text x="60" y="578" class="foot-text">FinOps：請求制計費 + 最少 0 個執行個體，沒人造訪不收費；Cloud Build 每月 2,500 建置分鐘、Artifact Registry 每月 0.5 GB 免費，舊映像檔由清理政策自動刪除。</text>
</svg>
