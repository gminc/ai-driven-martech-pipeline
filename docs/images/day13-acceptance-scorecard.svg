<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="1240" height="600" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #202124; }
      .zone { font-size: 14px; font-weight: 700; fill: #5f6368; }
      .raw { fill: #f1f3f4; stroke: #dadce0; stroke-width: 1.2; }
      .step { fill: #ffffff; stroke: #1a73e8; stroke-width: 1.4; }
      .ai { fill: #e8f0fe; stroke: #1a73e8; stroke-width: 1.8; }
      .out { fill: #e6f4ea; stroke: #188038; stroke-width: 1.6; }
      .gt { fill: #fef7e0; stroke: #f29900; stroke-width: 1.6; stroke-dasharray: 6 4; }
      .h { font-size: 15px; font-weight: 700; fill: #1a73e8; }
      .hg { font-size: 15px; font-weight: 700; fill: #188038; }
      .ho { font-size: 15px; font-weight: 700; fill: #b06000; }
      .hr { font-size: 14px; font-weight: 700; fill: #3c4043; }
      .t { font-size: 13px; fill: #3c4043; }
      .tb { font-size: 13px; font-weight: 700; fill: #3c4043; }
      .to { font-size: 13px; fill: #5f4100; }
      .note { font-size: 13px; fill: #5f6368; }
      .flow { stroke: #1a73e8; stroke-width: 2.2; fill: none; }
      .gflow { stroke: #f29900; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
      .wall { stroke: #f29900; stroke-width: 2; stroke-dasharray: 8 6; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f29900"/></marker>
  </defs>
  <rect width="1240" height="600" fill="#ffffff"/>
  <text x="40" y="44" class="title">Day 13｜先把答案藏好再來考，看它能找回幾個</text>
  <text x="40" y="70" class="note">答案表與判準放在 martech_gt，分析只讀 martech_dw；判準先 commit 再看成績，盲測判準在呼叫 Gemini 之前 commit</text>

  <!-- 上半：成績單 -->
  <text x="40" y="110" class="zone">martech_dw（Day 08–12 的結果表）</text>
  <rect x="40" y="126" width="262" height="148" rx="10" class="raw"/>
  <text x="58" y="154" class="hr">mart_attribution（Day 08）</text>
  <text x="58" y="178" class="hr">mart_diagnosis（Day 09）</text>
  <text x="58" y="202" class="hr">mart_customer_segment（Day 11）</text>
  <text x="58" y="226" class="hr">mart_customer_ltv（Day 12）</text>
  <text x="58" y="254" class="note">＋fct_ad_daily、fct_events、fct_orders</text>

  <rect x="332" y="126" width="250" height="148" rx="10" class="step"/>
  <text x="350" y="154" class="h">① scorecard.sql 算實測值</text>
  <text x="350" y="180" class="t">點擊成本倍數 2.014、週倍數 0.921</text>
  <text x="350" y="202" class="t">追蹤事件 ÷ 訂單 0、Meta 首÷末 1.58</text>
  <text x="350" y="224" class="t">占比＋12.8 點、分群最低命中 0.17</text>
  <text x="350" y="252" class="note">只有 S5 兩項要用答案表的顧客類型</text>

  <rect x="612" y="126" width="262" height="148" rx="10" class="out"/>
  <text x="630" y="154" class="hg">② 成績單 acceptance_scorecard</text>
  <text x="630" y="180" class="t">12 個檢查項目對照判準門檻</text>
  <text x="630" y="202" class="tb">S1、S2、S3、S6、S7 找到</text>
  <text x="630" y="224" class="tb">S5 部分找到、S4 待考</text>
  <text x="630" y="252" class="note">六題找回五題半</text>

  <path d="M302,200 L328,200" class="flow" marker-end="url(#a)"/>
  <path d="M582,200 L608,200" class="flow" marker-end="url(#a)"/>

  <!-- 下半：盲測 -->
  <text x="40" y="318" class="zone">AI 盲測（不挑異常、不給候選原因）</text>
  <rect x="40" y="334" width="262" height="150" rx="10" class="step"/>
  <text x="58" y="362" class="h">③ blind_prompt 整季週報</text>
  <text x="58" y="388" class="t">15 個廣告群組、30 個素材</text>
  <text x="58" y="410" class="t">每週追蹤購買 vs 後台訂單</text>
  <text x="58" y="432" class="t">每週各商品件數</text>
  <text x="58" y="460" class="note">60 行、8,262 個 Token</text>

  <rect x="332" y="334" width="250" height="150" rx="10" class="ai"/>
  <text x="350" y="362" class="h">④ AI.GENERATE_TEXT × 6</text>
  <text x="350" y="388" class="t">gemini-3.5-flash-lite × 3</text>
  <text x="350" y="410" class="t">gemini-3.6-flash × 3</text>
  <text x="350" y="432" class="t">回傳鎖成 JSON 發現清單</text>
  <text x="350" y="460" class="note">thinking_budget 0，實付 NT$ 1.45</text>

  <rect x="612" y="334" width="262" height="150" rx="10" class="out"/>
  <text x="630" y="362" class="hg">⑤ blind_score 三組關鍵字評分</text>
  <text x="630" y="388" class="tb">S1 點擊成本翻倍　3/3、3/3</text>
  <text x="630" y="410" class="tb">S2 追蹤事件缺口　3/3、3/3</text>
  <text x="630" y="432" class="tb">S3 素材點擊率衰退 3/3、3/3</text>
  <text x="630" y="460" class="tb">S7 專案商品件數　0/3、1/3</text>

  <path d="M302,409 L328,409" class="flow" marker-end="url(#a)"/>
  <path d="M582,409 L608,409" class="flow" marker-end="url(#a)"/>

  <!-- 右側：答案表與判準 -->
  <line x1="905" y1="100" x2="905" y2="500" class="wall"/>
  <text x="925" y="110" class="zone">martech_gt（答案表與判準，分析不讀）</text>
  <rect x="925" y="126" width="275" height="110" rx="10" class="gt"/>
  <text x="943" y="154" class="ho">gt_signals、gt_customer_segment</text>
  <text x="943" y="180" class="to">Day 05 合成器植入的七個訊號</text>
  <text x="943" y="202" class="to">與 2,461 位顧客的真實類型</text>
  <text x="943" y="226" class="note">只有評分 SQL 會 JOIN</text>

  <rect x="925" y="256" width="275" height="104" rx="10" class="gt"/>
  <text x="943" y="284" class="ho">acceptance_criteria（12 列）</text>
  <text x="943" y="308" class="to">每題的數字門檻，9/24 commit</text>
  <text x="943" y="330" class="to">之後沒有再改</text>

  <rect x="925" y="380" width="275" height="104" rx="10" class="gt"/>
  <text x="943" y="408" class="ho">blind_criteria（4 列）</text>
  <text x="943" y="432" class="to">每題三組關鍵字，呼叫 Gemini 前</text>
  <text x="943" y="454" class="to">commit，run.sh 會比對時間戳</text>

  <path d="M925,308 L890,308 L890,200 L874,200" class="gflow" marker-end="url(#o)"/>
  <path d="M925,432 L890,432 L890,409 L874,409" class="gflow" marker-end="url(#o)"/>

  <text x="40" y="530" class="note">成績單：SQL 幾乎把植入的參數原封不動找回來，沒過的 S5a 是 Day 11 選 4 群照商品切、沉睡客散在四群裡</text>
  <text x="40" y="556" class="note">盲測：前三題兩個模型六次全中，放在題目最後一段的商品件數六次只有一次被列出來；17 項檢查全部通過</text>
</svg>
