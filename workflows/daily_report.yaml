# ==============================================================================
# 2026 iThome 鐵人賽 Day 27、28 - 行銷日報流程（Cloud Workflows）
#
# 做的事：
#   1. 看資料裡有沒有還沒通知過的成效異常，有就送一則警報到 Slack（Day 28）
#   2. 依序向 Day 26 的助理服務問三個固定問題，每問完一題就把結果寫進 martech_dw.daily_reports（Day 27）
#   3. 把日報送到 Slack，三題沒有全部答完則改送一則「日報沒有寫完」（Day 28）
#   今天已經有完整的日報時不再發問，但 Slack 還沒收到過的話會從日報表補送一次
#   三題沒有全部答完、或該送的訊息沒送出去，這次執行都以失敗結束
# 誰啟動：Cloud Scheduler（服務帳號 martech-scheduler，只有啟動流程的權限）或有權限的人手動啟動
# 用誰的身分做事：流程綁定的服務帳號 martech-pipeline-runner（部署時指定）
#
# 啟動時可以帶的參數（都可以不帶）：
#   trigger     啟動的來源，只是啟動的人自己填的標記，排程填 "scheduler"，沒填記成 "manual"
#   force       true 表示今天已經有完整的日報也重新問一次（會再花一次錢），預設 false
#   test_break  清單，例如 [2] 表示第 2 題改打一個不存在的路徑，用來不花錢地測試「這一題失敗了」的處理
#   notify      false 表示這一次不送 Slack（測試用），預設 true
#   as_of       把哪一天當成今天去看有沒有異常，格式 YYYY-MM-DD，用來重播過去的日子，沒帶就用資料裡最新的一天
#   renotify    true 表示已經通知過的異常也再送一次，預設 false（日報要重送請用 force，或等流程自己補送）
#
# 寫死在部署設定裡、不從參數讀的東西（環境變數）：
#   ASSISTANT_URL  助理的網址：流程會替它簽一張 martech-pipeline-runner 的身分權杖，
#                  網址如果能由啟動的人指定，只有啟動權限的人就能把這張權杖送到任何地方
#   DATASET        資料集名稱
#   SLACK_SECRET、SLACK_SECRET_VERSION  Slack Webhook 網址放在 Secret Manager 的哪個密鑰、哪個版本
# Slack 的網址本身不在這個檔案、不在環境變數、也不寫進任何紀錄，每次要送訊息才向 Secret Manager 拿
#
# 重試的原則：
#   問助理：只有確定「助理還沒開始花錢」的錯誤才重試，其他的錯記下來、換下一題
#   送 Slack：重送不花錢，最壞只是多一則訊息，所以 429 與 5xx 都重試
# 這個檔案本身不收費，步驟數在 Workflows 每月免費額度內，費用來自助理呼叫模型（一題約新台幣 0.15 到 0.3 元，三題約 0.5 到 0.9 元）
# ==============================================================================

main:
  params: [input]
  steps:
    # 真正的工作在 run_report，這裡只多做一件事：流程中途出了沒料到的錯，先送一則訊息到 Slack 再讓執行失敗
    - run:
        try:
          call: run_report
          args:
            input: ${input}
          result: summary
        except:
          as: crash
          steps:
            - crash_where:
                assign:
                  - crash_kind: unknown
                  - crash_exec: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
                  - crash_day: ${text.substring(time.format(sys.now(), "Asia/Taipei"), 0, 10)}
            - crash_tag:
                switch:
                  - condition: ${get_type(crash) == "map" and "code" in crash}
                    steps:
                      - crash_code:
                          assign:
                            - crash_kind: ${"http_" + string(crash.code)}
                  - condition: ${get_type(crash) == "map" and "tags" in crash and len(crash.tags) > 0}
                    steps:
                      - crash_tags:
                          assign:
                            - crash_kind: ${"error_" + crash.tags[0]}
            # 參數打錯不通知（那是啟動的人自己要看的錯），這一次指定不送 Slack 的也不通知
            - crash_default:
                assign:
                  - crash_notify_on: true
            - crash_quiet:
                switch:
                  - condition: ${crash_kind == "error_BadArgs"}
                    steps:
                      - quiet_bad_args:
                          assign:
                            - crash_notify_on: false
                  - condition: ${get_type(input) == "map" and get_type(map.get(input, "notify")) == "boolean"}
                    steps:
                      - quiet_as_asked:
                          assign:
                            - crash_notify_on: ${input.notify}
            # 訊息裡只放錯誤的種類與執行編號，不放錯誤的原文（原文裡可能有不該外流的內容）
            - crash_notify:
                call: notify
                args:
                  project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
                  dataset: ${sys.get_env("DATASET")}
                  report_date: ${crash_day}
                  execution_id: ${crash_exec}
                  kind: flow_error
                  dedupe_key: ${"flow_error:" + crash_exec}
                  message: ${"*行銷日報流程中途出錯*（" + crash_day + "）：" + crash_kind + "，執行編號 " + crash_exec + "，請到 Workflows 的執行清單查看"}
                  renotify: true
                  enabled: ${crash_notify_on}
                result: crash_sent
            - crash_raise:
                raise: ${crash}

    # 三題沒有全部答完、或該送的 Slack 訊息沒送出去，就讓這次執行以失敗結束，執行清單上才看得出來
    # 排程那一邊只知道「流程有被啟動」，日報完不完整要看這裡
    - finish:
        switch:
          - condition: ${summary.result in ["partial", "failed"] or summary.notify_failed > 0}
            raise: ${summary}
    - done:
        return: ${summary}

run_report:
  params: [input]
  steps:
    # 啟動時沒帶參數的話 input 是 null，另外放進 opts 再讀
    # 原本直接把參數重新指定成 {}，部署時被拒絕（cannot assign to a reserved variable 'args'），流程的參數只能讀
    - default_opts:
        assign:
          - opts: {}
    - read_input:
        switch:
          - condition: ${input != null}
            steps:
              - use_input:
                  assign:
                    - opts: ${input}

    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - execution_id: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
          - assistant_url: ${sys.get_env("ASSISTANT_URL")}
          - dataset: ${sys.get_env("DATASET")}
          - table: ${"`" + project + "." + dataset + ".daily_reports`"}
          - trigger: ${default(map.get(opts, "trigger"), "manual")}
          - force: ${default(map.get(opts, "force"), false)}
          - test_break: ${default(map.get(opts, "test_break"), [])}
          - notify_on: ${default(map.get(opts, "notify"), true)}
          - as_of: ${default(map.get(opts, "as_of"), "")}
          - renotify: ${default(map.get(opts, "renotify"), false)}
          - notify_failed: 0
          - alerts_sent: 0
          - nl: "\n"
          - asked: []
          # 日報的日期用台北時間，和助理每日上限的換日時間一致
          - report_date: ${text.substring(time.format(sys.now(), "Asia/Taipei"), 0, 10)}
          - ok_count: 0
          - failed_count: 0
          - skipped_count: 0
          - stop_reason: ""
          # 助理的回答限制在四句話以內，所以一份日報拆成三題，每一題各開一場對話
          - questions:
              - num: 1
                title: 上週花費
                text: 上週的廣告費總共是多少？花最多錢的是哪一支廣告？
              - num: 2
                title: 通路功勞
                text: 上週的訂單功勞哪個通路分到最多？前三名各是多少？
              - num: 3
                title: 成效異常
                text: 廣告成效有沒有出現過異常？最需要注意的是哪一筆，原因是什麼？

    - check_args:
        switch:
          - condition: ${not (trigger in ["scheduler", "manual"])}
            raise:
              tags: ["BadArgs"]
              message: 'trigger 只能是 "scheduler" 或 "manual"'
          - condition: ${get_type(force) != "boolean" or get_type(test_break) != "list"}
            raise:
              tags: ["BadArgs"]
              message: 'force 要是 true 或 false，test_break 要是清單，例如 [2]'
          - condition: ${get_type(notify_on) != "boolean" or get_type(renotify) != "boolean" or get_type(as_of) != "string"}
            raise:
              tags: ["BadArgs"]
              message: 'notify 與 renotify 要是 true 或 false，as_of 要是字串'
          - condition: ${as_of != "" and not text.match_regex(as_of, "^[0-9]{4}-[0-9]{2}-[0-9]{2}$")}
            raise:
              tags: ["BadArgs"]
              message: 'as_of 的格式是 YYYY-MM-DD，例如 "2026-08-27"'

    # 題號放成字串（例如 ["2"]）會對不到任何一題，結果是三題照問照花錢，所以先擋下來
    - check_break_items:
        for:
          value: b
          in: ${test_break}
          steps:
            - must_be_int:
                switch:
                  - condition: ${get_type(b) != "integer"}
                    raise:
                      tags: ["BadArgs"]
                      message: "test_break 裡面只能放題號（整數），例如 [2]"

    - log_start:
        call: sys.log
        args:
          severity: INFO
          json:
            event: daily_report_start
            report_date: ${report_date}
            trigger: ${trigger}
            force: ${force}
            test_break: ${test_break}
            notify: ${notify_on}
            as_of: ${as_of}
            renotify: ${renotify}

    # ── Day 28：先看有沒有還沒通知過的成效異常，這一步不呼叫模型 ──────────────────
    # 查異常出了錯不應該拖垮日報：記一筆、算成一次通知失敗，三題照問
    - alerts:
        try:
          steps:
            - look:
                call: anomaly_alerts
                args:
                  project: ${project}
                  dataset: ${dataset}
                  report_date: ${report_date}
                  execution_id: ${execution_id}
                  as_of: ${as_of}
                  renotify: ${renotify}
                  enabled: ${notify_on}
                result: alert_result
            - count_alerts:
                assign:
                  - alerts_sent: ${alert_result.sent}
                  - notify_failed: ${notify_failed + alert_result.failed}
        except:
          as: alert_error
          steps:
            - alerts_broken:
                assign:
                  - notify_failed: ${notify_failed + 1}
            - log_alerts_broken:
                call: sys.log
                args:
                  severity: ERROR
                  json:
                    event: anomaly_alerts_failed
                    report_date: ${report_date}

    # ── 今天已經有一份三題都答完的日報就不再問，重跑不花錢也不會多出一份 ──────────
    - find_existing:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${project}
          body:
            query: ${"SELECT COUNT(*) FROM (SELECT execution_id FROM " + table + " WHERE report_date = @report_date AND status = 'ok' GROUP BY execution_id HAVING COUNT(DISTINCT section_no) = @sections)"}
            useLegacySql: false
            location: US
            timeoutMs: 60000
            parameterMode: NAMED
            queryParameters:
              - name: report_date
                parameterType:
                  type: DATE
                parameterValue:
                  value: ${report_date}
              - name: sections
                parameterType:
                  type: INT64
                parameterValue:
                  value: ${string(len(questions))}
        result: existing

    - existing_must_finish:
        switch:
          - condition: ${not existing.jobComplete}
            raise: "查今天有沒有日報的查詢沒有在時限內完成，沒有發問"

    - skip_if_done:
        switch:
          - condition: ${int(existing.rows[0].f[0].v) > 0 and not force}
            steps:
              - log_skip:
                  call: sys.log
                  args:
                    severity: INFO
                    json:
                      event: daily_report_skipped
                      report_date: ${report_date}
                      reason: already_complete
              # 日報已經寫好但 Slack 可能還沒收到（上一次送失敗、或那一次指定不送），從日報表組一次訊息補送
              # 送過的會被擋成 duplicate，這一步不呼叫模型
              - load_done:
                  call: googleapis.bigquery.v2.jobs.query
                  args:
                    projectId: ${project}
                    body:
                      query: ${"SELECT CAST(section_no AS STRING), section_title, answer FROM `" + project + "." + dataset + ".v_daily_report` WHERE report_date = @report_date AND status = 'ok' ORDER BY section_no"}
                      useLegacySql: false
                      location: US
                      timeoutMs: 60000
                      parameterMode: NAMED
                      queryParameters:
                        - name: report_date
                          parameterType:
                            type: DATE
                          parameterValue:
                            value: ${report_date}
                  result: done_rows
              - done_head:
                  assign:
                    - done_message: ${"*行銷日報 " + report_date + "*"}
                    - done_notice: failed
              - done_ready:
                  switch:
                    - condition: ${done_rows.jobComplete and "rows" in done_rows}
                      steps:
                        - done_body:
                            for:
                              value: dr
                              in: ${done_rows.rows}
                              steps:
                                - done_add:
                                    assign:
                                      - done_message: ${done_message + nl + nl + "*" + dr.f[0].v + " " + dr.f[1].v + "*" + nl + dr.f[2].v}
                        - done_send:
                            call: notify
                            args:
                              project: ${project}
                              dataset: ${dataset}
                              report_date: ${report_date}
                              execution_id: ${execution_id}
                              kind: daily_report
                              dedupe_key: ${"daily_report:" + report_date}
                              message: ${done_message}
                              renotify: false
                              enabled: ${notify_on}
                            result: done_notice
              - done_count:
                  assign:
                    - notify_failed: ${notify_failed + if(done_notice == "failed", 1, 0)}
              - return_skip:
                  return:
                    report_date: ${report_date}
                    execution_id: ${execution_id}
                    result: skipped_existing
                    asked: 0
                    alerts_sent: ${alerts_sent}
                    notify_failed: ${notify_failed}
                    report_notice: ${done_notice}

    # ── 一題一題問，問完一題就寫一列，流程中途停掉時前面問到的還在 ───────────────
    - ask_all:
        for:
          value: q
          in: ${questions}
          steps:
            - reset:
                assign:
                  - row_status: failed
                  - detail: error_unknown
                  - answer: ""
                  - session_id: ""
                  - path: /chat
                  - got: false
                  # 助理今天的額度用完之後，後面的題目問了也是同一句話，不再問
                  - do_ask: ${stop_reason == ""}

            - maybe_break:
                switch:
                  - condition: ${q.num in test_break}
                    steps:
                      - use_missing_path:
                          assign:
                            - path: /not-a-real-path

            - maybe_ask:
                switch:
                  - condition: ${do_ask}
                    steps:
                      - ask:
                          try:
                            steps:
                              - call_assistant:
                                  call: http.post
                                  args:
                                    url: ${assistant_url + path}
                                    # 助理只收帶這個標頭的 JSON 請求（Day 26 的來源檢查）
                                    headers:
                                      X-Martech-Chat: "1"
                                      Content-Type: application/json
                                    body:
                                      question: ${q.text}
                                    # 身分權杖由流程的服務帳號產生，對象固定是服務的網址（不含路徑）
                                    auth:
                                      type: OIDC
                                      audience: ${assistant_url}
                                    # 流程等 150 秒就放棄，助理那一邊可能還在跑，逾時的那一題錢可能已經花了
                                    timeout: 150
                                  result: resp
                              # 助理不管有沒有答出來都回 HTTP 200，真正的結果在 status 欄位，要自己看
                              - read_answer:
                                  assign:
                                    - detail: ${default(map.get(resp.body, "status"), "no_status")}
                                    - answer: ${default(map.get(resp.body, "answer"), "")}
                                    - session_id: ${default(map.get(resp.body, "session_id"), "")}
                                    - got: true
                          retry:
                            predicate: ${retry_if_not_started}
                            max_retries: 2
                            backoff:
                              initial_delay: 10
                              max_delay: 40
                              multiplier: 2
                          except:
                            as: e
                            steps:
                              - describe_error:
                                  switch:
                                    - condition: ${get_type(e) == "map" and "code" in e}
                                      steps:
                                        - http_error:
                                            assign:
                                              - detail: ${"http_" + string(e.code)}
                                    - condition: ${get_type(e) == "map" and "tags" in e and len(e.tags) > 0}
                                      steps:
                                        - tagged_error:
                                            assign:
                                              - detail: ${"error_" + e.tags[0]}

            - judge:
                switch:
                  - condition: ${not do_ask}
                    steps:
                      - mark_skipped:
                          assign:
                            - row_status: skipped
                            - detail: ${stop_reason}
                            - skipped_count: ${skipped_count + 1}
                  # 呼叫本身失敗（HTTP 錯誤、逾時、連線問題），detail 已經在上面填好
                  - condition: ${not got}
                    steps:
                      - mark_call_failed:
                          assign:
                            - failed_count: ${failed_count + 1}
                  - condition: ${detail in ["passed", "claims_flagged", "exits_sealed", "claims_flagged,exits_sealed"] and answer != ""}
                    steps:
                      - mark_ok:
                          assign:
                            - row_status: ok
                            - ok_count: ${ok_count + 1}
                  # 助理說答完了但回答是空的：不能算答完，原因另外標出來，不然日報表會出現「失敗、原因是 passed」
                  - condition: ${detail in ["passed", "claims_flagged", "exits_sealed", "claims_flagged,exits_sealed"]}
                    steps:
                      - mark_empty:
                          assign:
                            - detail: empty_answer
                            - failed_count: ${failed_count + 1}
                  - condition: ${detail == "daily_cap"}
                    steps:
                      - mark_cap:
                          assign:
                            - failed_count: ${failed_count + 1}
                            - stop_reason: daily_cap
                  - condition: true
                    steps:
                      - mark_failed:
                          assign:
                            - failed_count: ${failed_count + 1}

            - save:
                call: save_row
                args:
                  project: ${project}
                  table: ${table}
                  report_date: ${report_date}
                  execution_id: ${execution_id}
                  trigger: ${trigger}
                  q: ${q}
                  answer: ${answer}
                  row_status: ${row_status}
                  detail: ${detail}
                  session_id: ${session_id}

            - remember:
                assign:
                  - one: {}
                  - one.num: ${q.num}
                  - one.title: ${q.title}
                  - one.status: ${row_status}
                  - one.detail: ${detail}
                  - one.answer: ${answer}
                  - asked: ${list.concat(asked, one)}

    - summarize:
        assign:
          - summary:
              report_date: ${report_date}
              execution_id: ${execution_id}
              trigger: ${trigger}
              ok: ${ok_count}
              failed: ${failed_count}
              skipped: ${skipped_count}
              result: partial
              alerts_sent: ${alerts_sent}
              notify_failed: 0
              report_notice: none
    - name_result:
        switch:
          - condition: ${ok_count == len(questions)}
            steps:
              - is_complete:
                  assign:
                    - summary.result: complete
          - condition: ${ok_count == 0}
            steps:
              - is_failed:
                  assign:
                    - summary.result: failed

    # ── Day 28：把結果送到 Slack，三題都答完送日報，否則送「沒有寫完」 ──────────────
    - message_head:
        switch:
          - condition: ${summary.result == "complete"}
            steps:
              - head_complete:
                  assign:
                    - notice_kind: daily_report
                    - notice_key: ${"daily_report:" + report_date}
                    - message: ${"*行銷日報 " + report_date + "*"}
          - condition: true
            steps:
              - head_incomplete:
                  assign:
                    - notice_kind: report_incomplete
                    - notice_key: ${"report_incomplete:" + execution_id}
                    - message: ${"*行銷日報 " + report_date + " 沒有寫完*：" + string(len(questions)) + " 題答完 " + string(ok_count) + " 題"}
    # 測試用的參數有帶的時候在最前面標明，收到的人才不會當真
    - mark_test:
        switch:
          - condition: ${len(test_break) > 0}
            steps:
              - add_test_label:
                  assign:
                    - message: ${"【測試】" + message}
    - message_body:
        for:
          value: s
          in: ${asked}
          steps:
            - add_section:
                switch:
                  - condition: ${s.status == "ok"}
                    steps:
                      - add_answer:
                          assign:
                            - message: ${message + nl + nl + "*" + string(s.num) + " " + s.title + "*" + nl + s.answer}
                  - condition: true
                    steps:
                      - add_missing:
                          assign:
                            - message: ${message + nl + nl + "*" + string(s.num) + " " + s.title + "*" + nl + "（這一題沒有答案：" + s.detail + "）"}
    - message_tail:
        assign:
          - message: ${message + nl + nl + "執行編號 " + execution_id}
    - send_report:
        call: notify
        args:
          project: ${project}
          dataset: ${dataset}
          report_date: ${report_date}
          execution_id: ${execution_id}
          kind: ${notice_kind}
          dedupe_key: ${notice_key}
          message: ${message}
          renotify: ${renotify or force}
          enabled: ${notify_on}
        result: notice
    - record_notice:
        assign:
          - summary.report_notice: ${notice}
          - notify_failed: ${notify_failed + if(notice == "failed", 1, 0)}
          - summary.notify_failed: ${notify_failed}
    - log_end:
        call: sys.log
        args:
          severity: ${if(summary.result == "complete" and summary.notify_failed == 0, "INFO", "ERROR")}
          json:
            event: daily_report_end
            summary: ${summary}
    - give_back:
        return: ${summary}

# ── 只有確定助理還沒開始處理的錯誤才重試 ───────────────────────────────────────
#   429：Cloud Run 的執行個體都在忙，請求沒有進到程式
#   503 而且回應是助理自己寫的 unavailable：程式回報現在不能用，還沒呼叫模型
#   ConnectionFailedError：連線根本沒有建立
# 其他的 503 不重試：Cloud Run 在請求處理到一半、執行個體出狀況時也會回 503，那時模型可能已經被呼叫
# 逾時（TimeoutError）與連線中斷（ConnectionError）也不重試，理由相同，再問一次就是再花一次錢
retry_if_not_started:
  params: [e]
  steps:
    - only_before_work:
        switch:
          - condition: ${get_type(e) != "map"}
            return: false
          - condition: ${"code" in e and e.code == 429}
            return: true
          - condition: ${"code" in e and e.code == 503 and get_type(map.get(e, "body")) == "map" and map.get(e.body, "status") == "unavailable"}
            return: true
          - condition: ${"tags" in e and "ConnectionFailedError" in e.tags}
            return: true
    - otherwise:
        return: false

# ── 寫一列到日報表：值全部用查詢參數帶，不拼進 SQL 字串 ────────────────────────
save_row:
  params: [project, table, report_date, execution_id, trigger, q, answer, row_status, detail, session_id]
  steps:
    - insert:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${project}
          body:
            query: ${"INSERT INTO " + table + " (report_date, execution_id, trigger_source, section_no, section_title, question, answer, status, detail, session_id, created_at) VALUES (@report_date, @execution_id, @trigger_source, @section_no, @section_title, @question, @answer, @status, @detail, @session_id, CURRENT_TIMESTAMP())"}
            useLegacySql: false
            location: US
            timeoutMs: 60000
            parameterMode: NAMED
            queryParameters:
              - name: report_date
                parameterType:
                  type: DATE
                parameterValue:
                  value: ${report_date}
              - name: execution_id
                parameterType:
                  type: STRING
                parameterValue:
                  value: ${execution_id}
              - name: trigger_source
                parameterType:
                  type: STRING
                parameterValue:
                  value: ${trigger}
              - name: section_no
                parameterType:
                  type: INT64
                parameterValue:
                  value: ${string(q.num)}
              - name: section_title
                parameterType:
                  type: STRING
                parameterValue:
                  value: ${q.title}
              - name: question
                parameterType:
                  type: STRING
                parameterValue:
                  value: ${q.text}
              - name: answer
                parameterType:
                  type: STRING
                parameterValue:
                  value: ${answer}
              - name: status
                parameterType:
                  type: STRING
                parameterValue:
                  value: ${row_status}
              - name: detail
                parameterType:
                  type: STRING
                parameterValue:
                  value: ${detail}
              - name: session_id
                parameterType:
                  type: STRING
                parameterValue:
                  value: ${session_id}
        result: job
    - must_finish:
        switch:
          - condition: ${not job.jobComplete}
            raise: ${"日報表的寫入沒有在時限內完成：第 " + string(q.num) + " 題"}
    - saved:
        return: true


# ── Day 28：看 as_of 那一天有沒有落在某一筆異常的期間裡（期間結束後 7 天內也算），有而且還沒通知過就送警報 ──────
# 多留 7 天是因為全站的異常期間只有一天，排程漏跑一天就會永遠錯過，同一筆異常只送一次所以放寬也不會重複
# 異常與判讀都是 Day 09 算好的（diag_summary、mart_diagnosis），訊息的文字在 v_anomaly_alerts 這個 view 裡組好
# 所以這一步只查表、不呼叫模型，不花錢
anomaly_alerts:
  params: [project, dataset, report_date, execution_id, as_of, renotify, enabled]
  steps:
    - prepare:
        assign:
          - sent: 0
          - failed: 0
          - view: ${"`" + project + "." + dataset + ".v_anomaly_alerts`"}
    - find:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${project}
          body:
            query: ${"SELECT anomaly_id, message FROM " + view + " WHERE IF(@as_of = '', data_through, SAFE.PARSE_DATE('%Y-%m-%d', @as_of)) BETWEEN period_start AND DATE_ADD(period_end, INTERVAL 7 DAY) ORDER BY period_start, anomaly_id"}
            useLegacySql: false
            location: US
            timeoutMs: 60000
            parameterMode: NAMED
            queryParameters:
              - name: as_of
                parameterType:
                  type: STRING
                parameterValue:
                  value: ${as_of}
        result: found
    - must_finish:
        switch:
          - condition: ${not found.jobComplete}
            raise: "查成效異常的查詢沒有在時限內完成"
    # 沒有符合的列時，回傳的結果裡根本沒有 rows 這個欄位
    - none_found:
        switch:
          - condition: ${not ("rows" in found)}
            return:
              sent: 0
              failed: 0
    - each:
        for:
          value: r
          in: ${found.rows}
          steps:
            - send_alert:
                call: notify
                args:
                  project: ${project}
                  dataset: ${dataset}
                  report_date: ${report_date}
                  execution_id: ${execution_id}
                  kind: anomaly
                  dedupe_key: ${"anomaly:" + r.f[0].v}
                  message: ${r.f[1].v}
                  renotify: ${renotify}
                  enabled: ${enabled}
                result: outcome
            - tally:
                assign:
                  - sent: ${sent + if(outcome == "sent", 1, 0)}
                  - failed: ${failed + if(outcome == "failed", 1, 0)}
    - give_counts:
        return:
          sent: ${sent}
          failed: ${failed}

# ── Day 28：送一則訊息到 Slack，並在 ops_notifications 留一列 ───────────────────────────
# 回傳 sent（送出）、duplicate（這件事通知過了，不再送）、disabled（這一次不送）、failed（沒送出去）
# 這個子流程不會丟出錯誤：通知失敗不應該讓已經寫好的日報跟著不見，失敗只回報給呼叫的人
notify:
  params: [project, dataset, report_date, execution_id, kind, dedupe_key, message, renotify, enabled]
  steps:
    - prepare:
        assign:
          - log_table: ${"`" + project + "." + dataset + ".ops_notifications`"}
          - outcome: failed
          - detail: unknown_error
          - safe: ""
          # 出錯時記下錯在哪一段：查通知紀錄（check）、拿密鑰（secret）、送 Slack（slack）
          - stage: check
          - nl2: "\n"
          - cr: "\r"
    - skip_when_off:
        switch:
          - condition: ${not enabled}
            return: disabled
    - work:
        try:
          steps:
            # 同一件事只通知一次：異常用異常的編號，日報用日期，查通知紀錄裡有沒有送成功過
            - seen:
                call: googleapis.bigquery.v2.jobs.query
                args:
                  projectId: ${project}
                  body:
                    query: ${"SELECT COUNT(*) FROM " + log_table + " WHERE dedupe_key = @k AND status = 'sent'"}
                    useLegacySql: false
                    location: US
                    timeoutMs: 60000
                    parameterMode: NAMED
                    queryParameters:
                      - name: k
                        parameterType:
                          type: STRING
                        parameterValue:
                          value: ${dedupe_key}
                result: before
            - already:
                switch:
                  - condition: ${before.jobComplete and int(before.rows[0].f[0].v) > 0 and not renotify}
                    return: duplicate
            # Slack 的訊息格式裡 & < > 有特殊意義（連結、提及整個頻道都靠 < >），內容一律先換掉再送
            # 助理的回答是模型寫的，不能假設裡面沒有這些字
            - escape:
                assign:
                  - safe: ${text.replace_all(text.replace_all(text.replace_all(message, "&", "&amp;"), "<", "&lt;"), ">", "&gt;")}
            # 網址只活在這個子流程的變數裡，用完就沒了，不回傳、不寫紀錄
            - at_secret:
                assign:
                  - stage: secret
            - hook:
                call: googleapis.secretmanager.v1.projects.secrets.versions.accessString
                args:
                  secret_id: ${sys.get_env("SLACK_SECRET")}
                  version: ${sys.get_env("SLACK_SECRET_VERSION")}
                  project_id: ${project}
                result: hook_url
            # 從網頁貼進密鑰的人常會多帶一個換行或空白，網址裡本來就不會有這些字，直接拿掉
            - at_slack:
                assign:
                  - hook_url: ${text.replace_all(text.replace_all(text.replace_all(hook_url, nl2, ""), " ", ""), cr, "")}
                  - stage: slack
            - post:
                try:
                  call: http.post
                  args:
                    url: ${hook_url}
                    body:
                      text: ${safe}
                    timeout: 20
                  result: posted
                retry:
                  predicate: ${retry_slack}
                  max_retries: 2
                  backoff:
                    initial_delay: 5
                    max_delay: 20
                    multiplier: 2
            - ok:
                assign:
                  - outcome: sent
                  - detail: ${"http_" + string(posted.code)}
        except:
          as: e
          steps:
            # 只記錯誤的種類，不記錯誤的原文：送 Slack 失敗時原文裡可能帶著網址
            - why:
                switch:
                  - condition: ${get_type(e) == "map" and "code" in e}
                    steps:
                      - why_code:
                          assign:
                            - detail: ${stage + "_http_" + string(e.code)}
                  - condition: ${get_type(e) == "map" and "tags" in e and len(e.tags) > 0}
                    steps:
                      - why_tag:
                          assign:
                            - detail: ${stage + "_error_" + e.tags[0]}
    - keep:
        try:
          call: googleapis.bigquery.v2.jobs.query
          args:
            projectId: ${project}
            body:
              query: ${"INSERT INTO " + log_table + " (sent_at, report_date, execution_id, kind, dedupe_key, status, detail, message) VALUES (CURRENT_TIMESTAMP(), @d, @e, @kind, @k, @s, @detail, @m)"}
              useLegacySql: false
              location: US
              timeoutMs: 60000
              parameterMode: NAMED
              queryParameters:
                - name: d
                  parameterType:
                    type: DATE
                  parameterValue:
                    value: ${report_date}
                - name: e
                  parameterType:
                    type: STRING
                  parameterValue:
                    value: ${execution_id}
                - name: kind
                  parameterType:
                    type: STRING
                  parameterValue:
                    value: ${kind}
                - name: k
                  parameterType:
                    type: STRING
                  parameterValue:
                    value: ${dedupe_key}
                - name: s
                  parameterType:
                    type: STRING
                  parameterValue:
                    value: ${outcome}
                - name: detail
                  parameterType:
                    type: STRING
                  parameterValue:
                    value: ${detail}
                - name: m
                  parameterType:
                    type: STRING
                  parameterValue:
                    value: ${message}
          result: kept
        except:
          as: e2
          steps:
            # 訊息已經送出去但紀錄沒寫成，下一次會以為沒通知過而再送一次，寧可多送也不要漏
            - keep_failed:
                call: sys.log
                args:
                  severity: ERROR
                  json:
                    event: notification_log_failed
                    kind: ${kind}
                    dedupe_key: ${dedupe_key}
                    outcome: ${outcome}
    - tell:
        call: sys.log
        args:
          severity: ${if(outcome == "sent", "INFO", "ERROR")}
          json:
            event: notification
            kind: ${kind}
            dedupe_key: ${dedupe_key}
            outcome: ${outcome}
            detail: ${detail}
    - give:
        return: ${outcome}

# Slack 那一邊暫時忙不過來（429）或出錯（5xx）、或連線沒有建立，就再送一次
retry_slack:
  params: [e]
  steps:
    - maybe:
        switch:
          - condition: ${get_type(e) != "map"}
            return: false
          - condition: ${"code" in e and e.code in [429, 500, 502, 503, 504]}
            return: true
          - condition: ${"tags" in e and "ConnectionFailedError" in e.tags}
            return: true
    - otherwise:
        return: false
